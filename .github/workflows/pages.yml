name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/cats-pdf-document-mdt9jl]
  workflow_dispatch:

# Read the repo, publish Pages, and prove the deployment's identity.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the site file is up to date with its source
        run: |
          python3 tools/build-standalone.py
          if ! git diff --quiet -- index.html; then
            echo "::error file=index.html::index.html is stale. Run 'python3 tools/build-standalone.py' and commit the result."
            git diff --stat -- index.html
            exit 1
          fi

      # enablement: true turns Pages on if it is off, so no repository
      # setting has to be changed by hand.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v4
